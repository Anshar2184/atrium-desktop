name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  probes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build probes
        run: dotnet build poc/Atrium.Poc.sln -c Release

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset win-x64 -S native
      - name: Build guard
        run: cmake --build native/build/win-x64 --config Release
