name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  probes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build probes
        run: dotnet build poc/Atrium.Poc.sln -c Release
