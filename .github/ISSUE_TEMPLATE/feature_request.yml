name: Idea or design feedback
description: Suggest a feature or comment on the architecture
labels: [design]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should Atrium do, and why?
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Windows constraints
      description: Public APIs involved, known limitations, or decisions in docs/DECISIONS.md this touches.
