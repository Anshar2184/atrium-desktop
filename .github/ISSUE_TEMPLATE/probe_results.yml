name: Probe results from my machine
description: Share verification results from a configuration we have not tested yet
labels: [verification]
body:
  - type: input
    id: build
    attributes:
      label: Windows build
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Monitors, scaling, refresh rate, HDR, GPUs, taskbar settings, desktop icons on/off.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Attach the JSON files from `poc/results/` and note anything that looked wrong on screen.
    validations:
      required: true
