name: Bug report
description: Something in Atrium does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Windows build
      description: Output of `winver`, e.g. 26100.2454
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Displays and GPUs
      description: Number of monitors, resolution, scaling, HDR, GPUs.
  - type: textarea
    id: results
    attributes:
      label: Log
      description: The relevant lines of `%LOCALAPPDATA%\Atrium\logs\core.log`. Do not include screenshots with personal content.
